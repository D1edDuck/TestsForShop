name: Playwright

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clean previous volumes
        run: docker compose down -v --remove-orphans 2>/dev/null || true

      - name: Run Playwright tests
        run: docker compose up --build --abort-on-container-exit --exit-code-from playwright

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            Playwright-Study/test-results/
            Playwright-Study/playwright-report/

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: Playwright-Study/playwright-report/index.html
          if-no-files-found: warn

      - name: Cleanup
        if: always()
        run: docker compose down -v --remove-orphans 2>/dev/null || true
